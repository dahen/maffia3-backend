name: Build Maffia release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New stable version, for example v0.2.0'
        required: true
      frontend_sha:
        description: 'Full 40-character commit SHA from dahen/maffia3-frontend'
        required: true
permissions:
  contents: read
concurrency:
  group: maffia-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ inputs.version }}
      FRONTEND_SHA: ${{ inputs.frontend_sha }}
      BACKEND_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: maffia3-backend
          persist-credentials: false
      - name: Validate release inputs
        working-directory: maffia3-backend
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$FRONTEND_SHA" =~ ^[a-f0-9]{40}$ ]]
          if gh release view "$VERSION" --repo dahen/maffia3-backend >/dev/null 2>&1; then
            echo 'This release already exists. Choose a new version.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: dahen/maffia3-frontend
          ref: ${{ inputs.frontend_sha }}
          path: maffia3-frontend
          token: ${{ secrets.MAFFIA_SOURCE_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check and test backend
        working-directory: maffia3-backend
        run: |
          npm ci
          npm run check
          npm test
      - name: Build frontend
        working-directory: maffia3-frontend
        run: |
          npm ci
          npm run build
      - name: Prepare clean image context
        run: |
          mkdir image-context
          git -C maffia3-backend archive HEAD | tar -x -C image-context --one-top-level=maffia3-backend
          git -C maffia3-frontend archive HEAD | tar -x -C image-context --one-top-level=maffia3-frontend
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: image-context
          file: image-context/maffia3-backend/deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/dahen/maffia3-backend:${{ inputs.version }}
          build-args: |
            VERSION=${{ inputs.version }}
            BACKEND_SHA=${{ github.sha }}
            FRONTEND_SHA=${{ inputs.frontend_sha }}
      - name: Publish release manifest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          node --input-type=module -e "import {writeFileSync} from 'node:fs'; const e=process.env; writeFileSync('maffia-release.json',JSON.stringify({version:e.VERSION,image:'ghcr.io/dahen/maffia3-backend@'+e.IMAGE_DIGEST,backend:e.BACKEND_SHA,frontend:e.FRONTEND_SHA},null,2))"
          gh release create "$VERSION" maffia-release.json --repo dahen/maffia3-backend --target "$BACKEND_SHA" --title "Maffia $VERSION" --generate-notes --draft
          gh release edit "$VERSION" --repo dahen/maffia3-backend --draft=false --latest
